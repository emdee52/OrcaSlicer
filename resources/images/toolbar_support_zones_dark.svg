  <path d="M17 10 H29 L17 30 H5 Z" style="fill:none;stroke:#009688;stroke-width:1.5;stroke-linejoin:round"/>
  <path d="M4 30 H35 V35 H4 Z" style="fill:none;stroke:#b6b6b6;stroke-width:1.3;stroke-linejoin:round"/>
</svg>
